# .mise.toml — maintainer tooling for python-project-template itself.
# Generated projects get their own .mise.toml from template/.mise.toml.jinja.
#   mise trust && mise install && mise tasks

[tools]
python = "3.15"
uv = "0.13.9"            # keep equal to copier.yml uv_version (check_pins enforces the hook rev)
trivy = "0.76.2"
gitleaks = "8.30.1"
actionlint = "1.7.12"

[env]
COPIER = "uvx --from copier==9.19.1 copier"   # one Copier version for every maintainer task
PYTHONDONTWRITEBYTECODE = "1"

[tasks.lint]
description = "Template repo hygiene: hooks, workflow lint, pin policy, nothing in template/ ignored"
run = """
uvx pre-commit run --all-files
actionlint
python3 scripts/check_pins.py
ignored="$(git status --ignored --porcelain template/ | grep '^!!' || true)"
[ -z "$ignored" ] || { echo "files under template/ are git-ignored and would never ship:"; echo "$ignored"; exit 1; }
"""

[tasks.render]
description = "Render one variant (into <tmp>/python-project-template-render/<variant>) without running gates: mise run render -- service"
run = "python3 scripts/render.py --no-gates"

[tasks.render-test]
description = "Render a variant and run its own gates: mise run render-test -- service (REQUIRE_CONTAINER=1 adds image, scan, smoke)"
run = "python3 scripts/render.py"

[tasks.render-all]
description = "Render and gate every variant (no container stages unless REQUIRE_CONTAINER=1)"
run = """
for v in service library library-container notebooks service-py314 service-py313; do
  python3 scripts/render.py "$v"
done
"""

[tasks.negative-controls]
description = "Break each rule on purpose and prove a named check fails (add -- --offline to skip PyPI)"
run = "python3 scripts/negative_controls.py"

[tasks.update-test]
description = "Prove copier update brings template changes and keeps local edits"
run = "python3 scripts/update_test.py"

[tasks.pins]
description = "Pin policy only (release mode: mise run pins -- --release --tag vX.Y.Z)"
run = "python3 scripts/check_pins.py"

[tasks.pin-images]
description = "Resolve base image digests (dry run; add -- --write to update copier.yml)"
run = "bash scripts/pin_images.sh"

[tasks.template-ci]
description = "Everything template-ci.yml runs, locally"
depends = ["lint"]
run = """
mise run render-all
python3 scripts/negative_controls.py
python3 scripts/update_test.py
"""
