# polyglot/mise-node.toml — Node.js baseline for non-Python repos (or a Node part of a polyglot repo).
# Copy to your repo as .mise.toml. Same idea as the Python template: pinned tools, one `ci` task.
[tools]
node = "26"              # Active LTS since 2026-10-28 (supported to April 2029); the line pin picks up
                         # security patches. Pin a full version (e.g. "26.13.1") for strict reproducibility.
# Node 25+ no longer ships Corepack, so pin pnpm or yarn here instead if you use one:
# pnpm = "10"
# yarn = "4"

[env]
NODE_ENV = "development"

[tasks.bootstrap]
description = "Install dependencies exactly as locked (choose ONE package manager)"
run = """
npm ci
# pnpm (pinned in [tools]):  pnpm install --frozen-lockfile
# yarn (pinned in [tools]):  yarn install --immutable
"""

[tasks.lint]
run = "npm run lint"

[tasks.test]
run = "npm test"

[tasks.build]
run = "npm run build"

[tasks.ci]
description = "CI gate: locked install, lint, test, build (every step must pass)"
run = """
npm ci
npm run lint
npm test
npm run build
"""
