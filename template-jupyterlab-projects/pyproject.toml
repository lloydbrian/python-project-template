# Rename before first use: "jupyter-ai-labs" (distribution) and "labs" (import package)
[project]
name = "jupyter-ai-labs"
version = "0.1.0"
description = "JupyterLab exercises for AI / agentic AI (reproducible, high-quality)"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Lloyd D." }]
keywords = ["jupyter", "notebooks", "ai", "agentic-ai", "education"]
dependencies = [
  # Notebook runtime
  "jupyterlab>=4.2",
  "ipykernel>=6.29",
  # Data stack
  "numpy>=2.3",
  "pandas>=2.3",
  # API calls / tools used in exercises
  "httpx>=0.27",
  "tenacity>=9.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "rich>=13.7",
]

[project.optional-dependencies]       # optional features: uv sync --extra docs
docs = ["nbconvert>=7.16"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[dependency-groups]                   # tooling: installed by `uv sync`, never shipped
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.17",
  "mypy>=1.18",
  "pre-commit>=4.0",
]
security = ["pip-audit>=2.7", "bandit>=1.8"]
notebooks = ["nbqa>=1.10", "nbstripout>=0.9", "jupyterlab-git>=0.50"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
respect-gitignore = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "S", "RUF"]   # S = security rules
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]                 # assert is how pytest works

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["labs"]
mypy_path = "src"
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov --cov-report=term-missing"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
markers = ["live: calls a real external API (needs credentials; excluded from CI)"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
