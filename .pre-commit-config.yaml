# Hooks for the template repo itself. Generated projects get theirs from template/.pre-commit-config.yaml.jinja.
# Template files (*.jinja) are not valid YAML/TOML/Python until rendered, so they are excluded from
# syntax checks here; scripts/render.py checks the rendered output instead.
exclude: ^template/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-executables-have-shebangs
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
