# python-ci.yml — the shared CI for every project generated from this template.
#
# Generated projects call it from a short .github/workflows/ci.yml, pinned to a template release:
#   uses: lloydbrian/python-project-template/.github/workflows/python-ci.yml@vX.Y.Z
# so pipeline fixes ship once, as a template release, and reach projects through `copier update`.
# Third-party actions are pinned by commit SHA (tag in the comment); see ADR 0007.
name: python-ci

on:
  workflow_call:
    inputs:
      image:
        description: Build the image with Podman, run the in-image tests, scan it and upload an SBOM
        type: boolean
        default: true
      smoke:
        description: Run the built image hardened and check the health endpoints (services)
        type: boolean
        default: false
      mise-version:
        description: mise release used to install the repo's pinned tools
        type: string
        default: "2026.11.13"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}   # CI trusts the checked-out repo's .mise.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ inputs.mise-version }}
          install: true

      - name: Gates (identical to `mise run ci` on a laptop)
        run: mise run ci

      - name: Dependency and code security
        run: mise run security

      - name: Tests inside the image
        if: inputs.image
        run: podman build -f .container/Containerfile --target test .

      - name: Build image
        if: inputs.image
        run: mise run image

      - name: Scan image
        if: inputs.image
        run: mise run scan

      - name: SBOM
        if: inputs.image
        run: mise run sbom

      - name: Smoke test
        if: inputs.smoke
        run: mise run smoke

      - name: Upload SBOM
        if: inputs.image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
