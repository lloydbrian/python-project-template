# python-release.yml — shared release for generated projects that ship an image.
#
# No registry is used (ADR 0011). On a version tag it builds the image natively on amd64 and
# arm64 runners, exports each as an OCI archive, scans it, writes a CycloneDX SBOM, records
# build provenance (GitHub artifact attestations) and attaches everything to a GitHub release.
# Load an archive with:  podman load -i <name>-<version>-linux-<arch>.oci.tar
name: python-release

on:
  workflow_call:
    inputs:
      name:
        description: Image and artifact name (the project slug)
        type: string
        required: true
      target:
        description: Containerfile stage to ship (prod, or lab for notebooks)
        type: string
        default: prod
      mise-version:
        type: string
        default: "2026.11.13"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write        # sign the provenance attestation
      attestations: write    # store it
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      NAME: ${{ inputs.name }}
      TARGET: ${{ inputs.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ inputs.mise-version }}
          install: true

      - name: Tag must match the project version
        run: |
          version="$(uv version --short)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME does not match project version v$version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Gates
        run: mise run ci

      - name: Ensure Podman is available
        run: command -v podman || { sudo apt-get update && sudo apt-get install -y --no-install-recommends podman; }

      - name: Build (native ${{ matrix.arch }})
        run: |
          podman build --pull=newer -f .container/Containerfile --target test .
          podman build --pull=newer -f .container/Containerfile --target "$TARGET" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "localhost/$NAME:$VERSION" .

      - name: Export OCI archive
        run: |
          mkdir -p dist
          podman save --format oci-archive -o "dist/$NAME-$VERSION-linux-$ARCH.oci.tar" "localhost/$NAME:$VERSION"

      - name: Scan
        run: |
          uv run python tools/check_scan_exceptions.py .trivyignore
          trivy image --input "dist/$NAME-$VERSION-linux-$ARCH.oci.tar" --severity HIGH,CRITICAL \
            --ignore-unfixed --ignorefile .trivyignore --exit-code 1

      - name: SBOM
        run: trivy image --input "dist/$NAME-$VERSION-linux-$ARCH.oci.tar" --format cyclonedx --output "dist/$NAME-$VERSION-linux-$ARCH.sbom.cdx.json"

      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.oci.tar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write        # create the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum ./* > SHA256SUMS && cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
