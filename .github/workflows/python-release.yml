# python-release.yml — shared release for generated projects that ship an image.
#
# No registry is used (ADR 0011). On a version tag it builds the image natively on amd64 and
# arm64 runners, exports each as an OCI archive, scans it, writes a CycloneDX SBOM, records
# build provenance (GitHub artifact attestations) and attaches everything to a GitHub release.
# Load an archive with:  podman load -i <name>-<version>-linux-<arch>.oci.tar
#
# Trust boundary: the build job runs the project's code and tooling (tests, hooks, dependencies)
# with a read-only token and NO id-token. Only the separate `attest` job can sign, and it runs
# no project code: it downloads the archives and attests them.
name: python-release

on:
  workflow_call:
    inputs:
      name:
        description: Image and artifact name (the project slug)
        type: string
        required: true
      target:
        description: Containerfile stage to ship (prod, or lab for notebooks)
        type: string
        default: prod
      mise-version:
        type: string
        default: "2026.11.14"
      attest:
        description: >-
          Record build provenance on public repositories. Private repositories always skip it:
          GitHub supports attestations there only on Enterprise Cloud, which this template does
          not assume.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      NAME: ${{ inputs.name }}
      TARGET: ${{ inputs.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # full history, so `mise run ci`'s secret scan sees every commit
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ inputs.mise-version }}
          install: true

      - name: Tag must match the project version
        id: version
        # Normalised PEP 440 forms must be identical: v0.2.0-rc.1 matches 0.2.0rc1, but v0.2
        # does not match 0.2.0. Pre-release status comes from the same parse.
        run: |
          version="$(uv version --short)"
          uv run --no-project --with 'packaging==26.4' python - "$GITHUB_REF_NAME" "$version" <<'PY'
          import os, sys
          from packaging.version import Version
          tag, version = Version(sys.argv[1]), Version(sys.argv[2])
          if str(tag) != str(version):
              sys.exit(f"::error::tag {sys.argv[1]} does not match project version {sys.argv[2]}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"prerelease={'true' if tag.is_prerelease else 'false'}\n")
          PY
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Gates
        run: mise run ci

      - name: Ensure Podman is available
        run: command -v podman || { sudo apt-get update && sudo apt-get install -y --no-install-recommends podman; }

      - name: Build (native ${{ matrix.arch }})
        run: |
          podman build --pull=newer -f .container/Containerfile --target test .
          podman build --pull=newer -f .container/Containerfile --target "$TARGET" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "localhost/$NAME:$VERSION" .

      - name: Export OCI archive
        run: |
          mkdir -p dist
          podman save --format oci-archive -o "dist/$NAME-$VERSION-linux-$ARCH.oci.tar" "localhost/$NAME:$VERSION"

      # trivy reads an OCI layout directory or a docker archive with --input, not an OCI archive
      # file, so the shipped archive is unpacked once and both steps read exactly what ships.
      - name: Unpack the archive for scanning
        run: |
          mkdir -p "$RUNNER_TEMP/oci-$ARCH"
          tar -xf "dist/$NAME-$VERSION-linux-$ARCH.oci.tar" -C "$RUNNER_TEMP/oci-$ARCH"

      - name: Scan
        run: |
          uv run python tools/check_scan_exceptions.py .trivyignore
          trivy image --input "$RUNNER_TEMP/oci-$ARCH" --severity HIGH,CRITICAL \
            --ignore-unfixed --ignorefile .trivyignore --exit-code 1

      - name: SBOM
        run: trivy image --input "$RUNNER_TEMP/oci-$ARCH" --format cyclonedx --output "dist/$NAME-$VERSION-linux-$ARCH.sbom.cdx.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  attest:
    needs: build
    if: inputs.attest && (!github.event.repository.private)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write        # sign the provenance attestation
      attestations: write    # store it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Build provenance (archives and SBOMs)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.oci.tar
            dist/*.sbom.cdx.json

  publish:
    needs: [build, attest]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.attest.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write        # create the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum ./* > SHA256SUMS && cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          prerelease=""
          [ "$PRERELEASE" = "true" ] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $prerelease
