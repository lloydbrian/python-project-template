# release.yml — releases the template itself. Push a tag vX.Y.Z (or vX.Y.Z-rc.N) to run it.
# It refuses to release unless copier.yml's template_ref equals the tag and every base image is
# pinned by digest, then runs the full template CI and creates the GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_pins.py --release --tag "$GITHUB_REF_NAME"

  template-ci:
    needs: verify
    uses: ./.github/workflows/template-ci.yml

  publish:
    needs: template-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/changelog_section.py "${GITHUB_REF_NAME#v}" > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease
