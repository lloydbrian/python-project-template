name: Question
description: How do I…? Why does the template…?
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Include what you tried and what you read (README section, ADR).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Template version, if it is about a generated project
      placeholder: v2.0.1
